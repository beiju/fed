[package]
name = "eventually_api"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
derive_builder = "0.20.2"
futures = "0.3.32"
itertools = "0.14.0"
log = "0.4.29"
num_enum = "0.7.6"
pot = "3.0.1"
reqwest = { version = "0.13.2", features = ["query"] }
schemars = { version = "1.2.1", features = ["chrono04", "uuid1", "preserve_order"] }
serde = "1.0.228"
serde_json = "1.0.149"
serde_repr = "0.1.20"
sled = "0.34.7"
uuid = { version = "1.23.1", features = ["serde"] }
with_structure = { path = "../with_structure" }
