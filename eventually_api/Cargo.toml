[package]
name = "eventually_api"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.19", features = ["serde"] }
derive_builder = "0.20.2"
futures = "0.3.21"
itertools = "0.14.0"
log = "0.4.17"
num_enum = "0.7.0"
pot = "3.0.0"
reqwest = { version = "0.13.1", features = ["query"] }
schemars = { version = "1.2.0", features = ["chrono04", "uuid1", "preserve_order"] }
serde = "1.0.138"
serde_json = "1.0.82"
serde_repr = "0.1.8"
sled = "0.34.7"
uuid = { version = "1.2.2", features = ["serde"] }
with_structure = { path = "../with_structure" }