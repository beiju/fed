[package]
name = "fed"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
derive_builder = "0.20.2"
eventually_api = { path = "../eventually_api" }
itertools = "0.14.0"
nom = "8.0.0"
nom-language = "0.1.0"
num_enum = "0.7.6"
schemars = { version = "1.2.1", features = ["chrono04", "uuid1", "preserve_order", "either1"] }
serde = "1.0.228"
serde_json = "1.0.149"
strum_macros = "0.28.0"
thiserror = "2.0.18"
# Don't remove the `either` dependency no matter how much RustRover cries. We
# need this specification for the `serde` feature.
either = { version = "1.15.0", features = ["serde"] }
uuid = { version = "1.23.1", features = ["serde"] }
with_structure = { path = "../with_structure", features = ["either", "serde"] }
stacker = "0.1"
strum = "0.28.0"
float-cmp = "0.10.0"
serde_repr = "0.1.21"
